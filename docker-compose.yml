services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
      - node_modules:/var/www/node_modules
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=projeto
      - DB_USERNAME=root
      - DB_PASSWORD=
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=projeto
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
  vendor:
  node_modules:
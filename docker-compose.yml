services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3307
      DB_DATABASE: projeto
      DB_USERNAME: root
      DB_PASSWORD: ""
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --port=3307
    ports:
      - "3307:3307"
    environment:
      MYSQL_DATABASE: projeto
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: